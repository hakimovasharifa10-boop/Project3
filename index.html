<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body>
    <header>
      <nav class="bg-[#030303]">
        <div
          class="p-5 max-w-300 m-auto text-white lg:flex lg:justify-between lg:items-center flex justify-between"
        >
          <img src="./images/Logo (6).svg" alt="img" />
          <div class="lg:flex lg:justify-between lg:gap-10 hidden">
            <a href="">Home</a>
            <a href="">Services</a>
            <a href="">Career</a>
            <a href="">Details</a>
            <a href="">Contact</a>
          </div>
          <button class="bg-[#0A84FF] lg:py-2 px-5 rounded-xl">Contact Us</button>
        </div>
      </nav>
    </header>
    <main class="bg-[#030303]">
      <div
        class="p-5 max-w-300 m-auto lg:flex lg:justify-between lg:items-center"
      >
        <div class="text-white">
          <h1 class="text-6xl font-bold">
            Transforming Data into
            <span class="bg-[#0A84FF] rounded-xl leading-26"
              >Decisions</span
            >
          </h1>
          <p class="lg:text-xl py-4">
            Leverage the power of machine learning and AI to unlock insights and
            drive business growth
          </p>
          <button class="bg-[#0A84FF] py-2 px-5 rounded-xl">
            Book a Meeting
          </button>
          <div class="flex gap-4 pt-10">
            <img src="./images/people.svg" alt="" />
            <p>Over 100+ clients have worked with us</p>
          </div>
        </div>
        <div class="right_sec1">
          <img src="./images/robot.png" alt="img" />
        </div>
      </div>
      <div
        class="border-t-1 border-b-1 border-[#8961FF] p-5 lg:flex lg:justify-between max-w-300 m-auto flex flex-wrap justify-between"
      >
        <img src="./images/zapier.png" alt=""  class="w-[150px]"/>
        <img src="./images/spotify.png" alt=""class="w-[150px]" />
        <img src="./images/zoom.png" alt="" class="w-[150px]"/>
        <img src="./images/slack.png" alt="" class="w-[150px]"/>
        <img src="./images/amazon.png" alt="" class="w-[150px]"/>
        <img src="./images/adobe.png" alt="" class="w-[150px]"/>
      </div>
    </main>
